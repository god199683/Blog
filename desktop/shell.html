<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ciel's Blog</title>
    <link rel="stylesheet" href="./shell.css">
  </head>
  <body>
    <nav class="desktop-tabs" aria-label="프로그램 탭">
      <div class="desktop-tab-list" data-tab-list></div>
      <div class="desktop-tab-actions">
        <button type="button" class="desktop-tab-action" data-new-tab aria-label="새 책 뷰어 탭" title="새 책 뷰어 탭 (Ctrl+T)">+</button>
        <button type="button" class="desktop-tab-action" data-split-tab aria-label="나란히 보기" title="나란히 보기 (Ctrl+\\)"><span aria-hidden="true">||</span></button>
      </div>
    </nav>
    <main class="desktop-tab-panels" data-tab-panels aria-label="콘텐츠"></main>
    <script src="./shell.js"></script>
  </body>
</html>
